[project]
name = "cdi-manager"
version = "0.1.0"
description = "A simple school project completed during my first year of high school for the NSI (Computer Science) course."
authors = [
    {name = "fredericguiose",email = "frederic.guiose@gmail.com"}
]

license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask (>=3.1.3,<4.0.0)"
]
[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "dotenv (>=0.9.9,<0.10.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
